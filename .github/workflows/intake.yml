name: Intake
run-name: Intake

# Checks the format of each submission issue and answers with a fixed reply. No secrets.
# The issue text is read by intake.mjs from the event file, never by the shell.

on:
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created, edited]

permissions: {}

concurrency:
  group: intake-${{ github.event.issue.number }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

jobs:
  intake:
    # Comments by anyone but the issue author never start the job.
    if: >-
      ${{ github.repository == 'edumpyard/lab' && !github.event.issue.pull_request
      && (github.event_name == 'issues' || github.event.comment.user.id == github.event.issue.user.id) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: intake

      - name: Check submission
        env:
          GH_TOKEN: ${{ github.token }}
        run: node intake/intake.mjs event
