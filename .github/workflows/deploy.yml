name: Deploy
run-name: Deploy site

on:
  push:
    branches: [deploy]

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

jobs:
  # Keep this job named "deploy": the publisher waits for it by that name.
  deploy:
    if: github.repository == 'edumpyard/lab'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ secrets.SRC_REPO }}
          ref: main
          ssh-key: ${{ secrets.SRC_KEY }}
          path: src
          persist-credentials: false
      - name: Build site
        id: build
        run: |
          node src/tool/lab.mjs build src out --counts "$GITHUB_OUTPUT"
          rm -rf src
      # No verbose tar: file names stay out of the log.
      - name: Pack site
        run: tar --directory out --dereference --hard-dereference -cf artifact.tar .
      - name: Upload site
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: github-pages
          path: artifact.tar
          retention-days: 1
          if-no-files-found: error
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      - name: Summary
        if: always()
        continue-on-error: true
        env:
          OUTCOME: ${{ steps.deployment.outcome }}
          PAGES: ${{ steps.build.outputs.pages || '-' }}
          URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          if [[ "$OUTCOME" == success ]]; then
            echo "::notice title=Deployed::$PAGES pages"
            alert=$'> [!NOTE]\n> Site deployed.'
          else
            alert=$'> [!CAUTION]\n'"> Deploy did not succeed ($OUTCOME)."
          fi
          {
            printf '%s\n\n| Pages | Deploy |\n|---|---|\n| %s | %s |\n' "$alert" "$PAGES" "$OUTCOME"
            if [[ -n "$URL" ]]; then
              printf '\nSite: %s\n' "$URL"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # The artifact is only needed by the deploy step, so it is removed right after.
  cleanup:
    name: Clean up
    needs: deploy
    if: always() && github.repository == 'edumpyard/lab'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Delete build artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ids=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --jq '.artifacts[].id')
          for id in $ids; do
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$id"
          done
